<!doctype html>
<html>
  <head>
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>My To-Do List</h1>

      <input class="task" type="text" placeholder="Enter a task" required />

      <button class="add">Add</button>

      <ul class="list"></ul>
      <p class="remaining">Remaining Tasks: 0</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
